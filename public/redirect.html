,0.9),0 0 60px rgba(201,101,74,0.08);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);animation:popIn 0.8s var(--ease)}@keyframes popIn{from{opacity:0;transform:translateY(30px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;padding-bottom:18px;border-bottom:1px solid var(--border)}.brand{font-family:var(--font-display);font-size:1.1rem;font-weight:700;letter-spacing:-0.5px;color:var(--text-primary)}.brand .dot{color:var(--accent)}.badge{font-family:var(--font-mono);font-size:0.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent-light);background:var(--accent-dim);border:1px solid var(--border-accent);padding:4px 12px;border-radius:60px;font-weight:500;display:flex;align-items:center;gap:6px}.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1.5s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}.headline{font-family:var(--font-display);font-size:clamp(1.8rem,4vw,2.4rem);font-weight:700;letter-spacing:-1px;line-height:1.15;margin-bottom:12px;color:#ffffff}.subhead{color:var(--text-secondary);font-size:0.92rem;line-height:1.6;margin-bottom:28px;font-weight:300}.destination-box{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:20px;transition:border-color 0.3s}.destination-box:hover{border-color:var(--border-accent)}.dest-label{font-family:var(--font-mono);font-size:0.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent-light);margin-bottom:6px;font-weight:600}.dest-url{font-family:var(--font-mono);font-size:0.92rem;color:#ffffff;word-break:break-all;line-height:1.4}.note-wrapper{background:rgba(201,101,74,0.04);border-left:2px solid var(--accent);border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:0 14px 14px 0;padding:18px 20px;margin-bottom:28px}.note-tag{font-family:var(--font-mono);font-size:0.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}.note-text{color:var(--text-primary);font-size:0.92rem;line-height:1.6;font-style:italic}.progress-track{width:100%;height:3px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin-bottom:16px}.progress-fill{width:100%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-light));transform-origin:left;transition:transform 1s linear}.timer-meta{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted);margin-bottom:28px;letter-spacing:1px}.timer-num{color:var(--accent-light);font-weight:600}.btn-cta{width:100%;background:rgba(201,101,74,0.08);border:1px solid rgba(201,101,74,0.3);color:var(--accent-light);font-family:var(--font-display);font-size:0.85rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;padding:16px 28px;border-radius:60px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:12px;transition:all 0.4s var(--ease)}.btn-cta:hover{background:rgba(201,101,74,0.2);border-color:var(--accent);color:#ffffff;box-shadow:0 0 40px rgba(201,101,74,0.25);transform:translateY(-2px)}.btn-cta:active{transform:translateY(0)}</style></head><body><canvas id="c"></canvas><div class="noise"></div><div class="vignette"></div><div class="shell"><div class="top-bar"><div class="brand">600266<span class="dot">.</span>xyz</div><div class="badge">Redirect</div></div><h1 class="headline">Transferring You</h1><p class="subhead">You are navigating to an external link published via 600266.xyz.</p><div class="destination-box"><div class="dest-label">Destination // {{TARGET_DOMAIN}}</div><div class="dest-url">{{TARGET_URL}}</div></div><div class="note-wrapper" id="noteCard"><div class="note-tag">Author Note</div><div class="note-text">{{NOTE}}</div></div><div class="progress-track"><div class="progress-fill" id="pFill"></div></div><div class="timer-meta"><span>AUTO REDIRECT</span><span>TRANSFERRING IN <span class="timer-num" id="tVal">{{COUNTDOWN}}S</span></span></div><a href="{{TARGET_URL}}" id="directBtn" class="btn-cta"><span>Proceed Now</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a></div><script>
const target="{{TARGET_URL}}";const rawNote="{{NOTE}}";const cd=parseInt("{{COUNTDOWN}}",10)||3;let rem=cd;const noteCard=document.getElementById('noteCard');const tVal=document.getElementById('tVal');const pFill=document.getElementById('pFill');if(!rawNote||rawNote==='{{NOTE}}'||rawNote.trim()===''){noteCard.style.display='none';}const iv=setInterval(()=>{rem--;if(rem<=0){clearInterval(iv);pFill.style.transform='scaleX(0)';tVal.textContent='0S';window.location.href=target;}else{tVal.textContent=rem+'S';pFill.style.transform=`scaleX(${rem/cd})`;}},1000);const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');let w,h,pts=[];function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;pts=[];for(let i=0;i<40;i++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.5});}window.addEventListener('resize',resize);resize();function render(){ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(201,101,74,0.4)';pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});requestAnimationFrame(render);}render();
</script></body></html>
